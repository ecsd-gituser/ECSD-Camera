<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ECSD Camera</title>

<!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-880CQT3EE8"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-880CQT3EE8');
</script>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
  body { background: #111; color: #fff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 10px;}
  h1 { margin: 20px 0; font-size: 2rem; text-align: center; }
  #cameraContainer { position: relative; width: 100%; max-width: 720px; flex: 1; display: flex; align-items: center; justify-content: center; }
  video { width: 100%; border-radius: 10px; background: #000; }
  canvas { display: none; }
  #previewContainer { margin-top: 15px; display: flex; flex-direction: column; align-items: center; }
  #previewContainer img, #previewContainer video { width: 320px; max-width: 100%; margin-top: 10px; border: 1px solid #ccc; border-radius: 5px; }
  #controls { display: flex; flex-wrap: wrap; justify-content: center; margin: 15px 0; gap: 10px; }
  select, button { padding: 10px 15px; font-size: 16px; border-radius: 5px; border: none; cursor: pointer; }
  select { background: #333; color: #fff; }
  button { background: #0078d4; color: #fff; }
  button:hover { background: #005a9e; }
  #status { margin-top: 10px; color: #0f0; text-align: center; }
  a { color: #0ff; }
</style>
</head>

<body>

<h1>ECSD Camera</h1>

<div id="cameraContainer">
  <video id="video" autoplay muted playsinline></video>
  <canvas id="canvas"></canvas>
</div>

<div id="controls">
  <label>
    Camera:
    <select id="cameraSelect">
      <option value="user">Front</option>
      <option value="environment">Back</option>
    </select>
  </label>

  <label>
    Mode:
    <select id="modeSelect">
      <option value="photo">Photo</option>
      <option value="video">Video</option>
      <option value="qr">QR Scan</option>
    </select>
  </label>

  <label>
    Format:
    <select id="formatSelect">
      <option value="webm">WebM</option>
      <option value="mp4">MP4 (if supported)</option>
    </select>
  </label>

  <button id="start">Start</button>
  <button id="stop" style="display:none;">Stop</button>
  <button id="download" style="display:none;">Download</button>
</div>

<div id="status"></div>
<div id="previewContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const startBtn = document.getElementById('start');
const stopBtn = document.getElementById('stop');
const downloadBtn = document.getElementById('download');
const modeSelect = document.getElementById('modeSelect');
const cameraSelect = document.getElementById('cameraSelect');
const formatSelect = document.getElementById('formatSelect');
const previewContainer = document.getElementById('previewContainer');
const status = document.getElementById('status');

let mediaStream = null;
let mediaRecorder = null;
let recordedChunks = [];
let scanning = false;
let qrAnimationFrame = null;
let currentMimeType = 'video/webm';

// Start camera
async function startCamera(facingMode = 'user') {
  if (mediaStream) mediaStream.getTracks().forEach(track => track.stop());
  try {
    mediaStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode },
      audio: true
    });
    video.srcObject = mediaStream;
  } catch (err) {
    status.textContent = "Camera/mic access denied.";
  }
}

cameraSelect.addEventListener('change', e => startCamera(e.target.value));
startCamera(cameraSelect.value);

// Start button
startBtn.addEventListener('click', () => {
  previewContainer.innerHTML = '';
  status.textContent = '';

  const mode = modeSelect.value;

  if (mode === 'photo') takePhoto();
  else if (mode === 'video') startVideoRecording();
  else startQRScan();
});

// Stop button
stopBtn.addEventListener('click', () => {
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    mediaRecorder.stop();
  }
  if (scanning) {
    scanning = false;
    cancelAnimationFrame(qrAnimationFrame);
    status.textContent = "QR stopped.";
  }
  stopBtn.style.display = 'none';
  startBtn.style.display = 'inline-block';
});

// Download
downloadBtn.addEventListener('click', () => {
  const timestamp = new Date().toISOString().replace(/[:.]/g, '-');

  if (modeSelect.value === 'photo') {
    canvas.toBlob(blob => {
      const link = document.createElement('a');
      link.download = `Photo_${timestamp}.png`;
      link.href = URL.createObjectURL(blob);
      link.click();
    });
  } else {
    const extension = currentMimeType.includes('mp4') ? 'mp4' : 'webm';
    const blob = new Blob(recordedChunks, { type: currentMimeType });

    const link = document.createElement('a');
    link.download = `Video_${timestamp}.${extension}`;
    link.href = URL.createObjectURL(blob);
    link.click();
  }

  downloadBtn.style.display = 'none';
});

// Photo
function takePhoto() {
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0);

  const img = document.createElement('img');
  img.src = canvas.toDataURL('image/png');
  previewContainer.appendChild(img);

  downloadBtn.style.display = 'inline-block';
  status.textContent = 'Photo ready!';
}

// Video
function startVideoRecording() {
  recordedChunks = [];

  let mimeType = 'video/webm';

  if (formatSelect.value === 'mp4') {
    if (MediaRecorder.isTypeSupported('video/mp4')) {
      mimeType = 'video/mp4';
    } else {
      status.textContent = 'MP4 not supported, using WebM.';
    }
  }

  currentMimeType = mimeType;

  mediaRecorder = new MediaRecorder(mediaStream, { mimeType });

  mediaRecorder.ondataavailable = e => {
    if (e.data.size > 0) recordedChunks.push(e.data);
  };

  mediaRecorder.onstop = () => {
    const blob = new Blob(recordedChunks, { type: currentMimeType });

    const vid = document.createElement('video');
    vid.src = URL.createObjectURL(blob);
    vid.controls = true;
    previewContainer.appendChild(vid);

    downloadBtn.style.display = 'inline-block';
    startBtn.style.display = 'inline-block';
    stopBtn.style.display = 'none';
    status.textContent = 'Video ready!';
  };

  mediaRecorder.start();
  startBtn.style.display = 'none';
  stopBtn.style.display = 'inline-block';
  status.textContent = 'Recording...';
}

// QR
function startQRScan() {
  scanning = true;
  startBtn.style.display = 'none';
  stopBtn.style.display = 'inline-block';
  status.textContent = 'Scanning QR...';

  const scanCanvas = document.createElement('canvas');
  const ctx = scanCanvas.getContext('2d');

  function scan() {
    if (!scanning) return;

    scanCanvas.width = video.videoWidth;
    scanCanvas.height = video.videoHeight;
    ctx.drawImage(video, 0, 0);

    const imageData = ctx.getImageData(0, 0, scanCanvas.width, scanCanvas.height);
    const code = jsQR(imageData.data, imageData.width, imageData.height);

    if (code) {
      let url = code.data;
      if (!/^https?:\/\//i.test(url)) url = 'https://' + url;

      status.innerHTML = `QR: <a href="${url}" target="_blank">${url}</a>`;
      scanning = false;
      startBtn.style.display = 'inline-block';
      stopBtn.style.display = 'none';
      return;
    }

    qrAnimationFrame = requestAnimationFrame(scan);
  }

  scan();
}
</script>

</body>
</html>
