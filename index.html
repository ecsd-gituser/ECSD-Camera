<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ECSD Camera</title>

<!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-880CQT3EE8"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-880CQT3EE8');
</script>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
  body { background: #111; color: #fff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 10px;}
  h1 { margin: 20px 0; font-size: 2rem; text-align: center; }
  #cameraContainer { position: relative; width: 100%; max-width: 720px; flex: 1; display: flex; align-items: center; justify-content: center; }
  video { width: 100%; height: auto; border-radius: 10px; background: #000; }
  canvas { display: none; }
  #previewContainer { margin-top: 15px; display: flex; flex-direction: column; align-items: center; }
  #previewContainer img, #previewContainer video { width: 320px; max-width: 100%; margin-top: 10px; border: 1px solid #ccc; border-radius: 5px; }
  #controls { display: flex; flex-wrap: wrap; justify-content: center; margin: 15px 0; gap: 10px; }
  select, button { padding: 10px 15px; font-size: 16px; border-radius: 5px; border: none; cursor: pointer; }
  select { background: #333; color: #fff; }
  button { background: #0078d4; color: #fff; transition: background 0.3s; }
  button:hover { background: #005a9e; }
  #status { margin-top: 10px; font-size: 16px; color: #0f0; text-align: center; word-break: break-word; }
  a { color: #0ff; text-decoration: underline; }
</style>
</head>
<body>

<h1>ECSD Camera</h1>

<div id="cameraContainer">
  <video id="video" autoplay muted playsinline></video>
  <canvas id="canvas"></canvas>
</div>

<div id="controls">
  <label>
    Camera:
    <select id="cameraSelect">
      <option value="user">Front</option>
      <option value="environment">Back</option>
    </select>
  </label>

  <label>
    Mode:
    <select id="modeSelect">
      <option value="photo">Photo</option>
      <option value="video">Video</option>
      <option value="qr">QR Scan</option>
    </select>
  </label>

  <button id="start">Start</button>
  <button id="stop" style="display:none;">Stop</button>
  <button id="download" style="display:none;">Download</button>
</div>

<div id="status"></div>
<div id="previewContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const startBtn = document.getElementById('start');
const stopBtn = document.getElementById('stop');
const downloadBtn = document.getElementById('download');
const modeSelect = document.getElementById('modeSelect');
const cameraSelect = document.getElementById('cameraSelect');
const previewContainer = document.getElementById('previewContainer');
const status = document.getElementById('status');

let mediaStream = null;
let mediaRecorder = null;
let recordedChunks = [];
let scanning = false;
let qrAnimationFrame = null;

// Start camera
async function startCamera(facingMode = 'user') {
  if (mediaStream) mediaStream.getTracks().forEach(track => track.stop());
  try {
    mediaStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode }, audio: true });
    video.srcObject = mediaStream;
  } catch (err) {
    status.textContent = "Error accessing camera/microphone.";
    console.error(err);
  }
}

cameraSelect.addEventListener('change', e => startCamera(e.target.value));
startCamera(cameraSelect.value);

// Capture / Record / QR
startBtn.addEventListener('click', () => {
  const mode = modeSelect.value;
  status.textContent = '';
  previewContainer.innerHTML = '';

  if (mode === 'photo') {
    takePhoto();
  } else if (mode === 'video') {
    startVideoRecording();
  } else if (mode === 'qr') {
    startQRScan();
  }
});

// Stop recording or scanning
stopBtn.addEventListener('click', () => {
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    mediaRecorder.stop();
  }
  if (scanning) {
    scanning = false;
    cancelAnimationFrame(qrAnimationFrame);
    status.textContent = "QR scanning stopped.";
    stopBtn.style.display = 'none';
    startBtn.style.display = 'inline-block';
  }
});

// Download media
downloadBtn.addEventListener('click', () => {
  const mode = modeSelect.value;
  const timestamp = new Date().toISOString().replace(/[:.]/g, '-');

  if (mode === 'photo') {
    canvas.toBlob(blob => {
      const link = document.createElement('a');
      link.download = `Photo_${timestamp}.png`;
      link.href = URL.createObjectURL(blob);
      link.click();
      URL.revokeObjectURL(link.href);
      downloadBtn.style.display = 'none';
    }, 'image/png');
  } else if (mode === 'video') {
    const blob = new Blob(recordedChunks, { type: 'video/webm' });
    const link = document.createElement('a');
    link.download = `Video_${timestamp}.webm`;
    link.href = URL.createObjectURL(blob);
    link.click();
    URL.revokeObjectURL(link.href);
    downloadBtn.style.display = 'none';
  }
});

// Photo capture
function takePhoto() {
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(video, 0, 0);

  canvas.toBlob(blob => {
    const img = document.createElement('img');
    img.src = URL.createObjectURL(blob);
    previewContainer.appendChild(img);
    downloadBtn.style.display = 'inline-block';
    status.textContent = 'Photo ready!';
  }, 'image/png');
}

// Video recording
function startVideoRecording() {
  recordedChunks = [];
  mediaRecorder = new MediaRecorder(mediaStream);
  mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
  mediaRecorder.onstop = () => {
    const blob = new Blob(recordedChunks, { type: 'video/webm' });
    const vid = document.createElement('video');
    vid.src = URL.createObjectURL(blob);
    vid.controls = true;
    previewContainer.appendChild(vid);

    downloadBtn.style.display = 'inline-block';
    startBtn.style.display = 'inline-block';
    stopBtn.style.display = 'none';
    status.textContent = 'Video recorded!';
  };
  mediaRecorder.start();
  startBtn.style.display = 'none';
  stopBtn.style.display = 'inline-block';
  status.textContent = 'Recording video...';
}

// QR scanning
function startQRScan() {
  scanning = true;
  startBtn.style.display = 'none';
  stopBtn.style.display = 'inline-block';
  status.textContent = 'Scanning for QR codes...';

  const scanCanvas = document.createElement('canvas');
  const scanCtx = scanCanvas.getContext('2d');

  function scanTick() {
    if (!scanning) return;
    scanCanvas.width = video.videoWidth;
    scanCanvas.height = video.videoHeight;
    scanCtx.drawImage(video, 0, 0, scanCanvas.width, scanCanvas.height);
    const imageData = scanCtx.getImageData(0, 0, scanCanvas.width, scanCanvas.height);
    const code = jsQR(imageData.data, imageData.width, imageData.height);
    if (code) {
      let url = code.data;
      if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
      status.innerHTML = `QR Code detected: <a href="${url}" target="_blank">${url}</a>`;
      scanning = false;
      startBtn.style.display = 'inline-block';
      stopBtn.style.display = 'none';
      return;
    }
    qrAnimationFrame = requestAnimationFrame(scanTick);
  }

  scanTick();
}
</script>

</body>
</html>
